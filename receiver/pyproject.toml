[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otprelay-receiver"
version = "0.1.0"
description = "Desktop receiver for otprelay: copies one-time codes from your phones to the clipboard"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.5",
    "PySide6-Addons>=6.5",  # provides QtWebSockets
    "PyNaCl>=1.5",
    "qrcode>=7.4",
    "keyring>=25",
]

[project.scripts]
otprelay-receiver = "otprelay_receiver.app:main"

[tool.appimage]
# Everything else (name, version, dependencies) is read from [project] above.
entry_point = "otprelay-receiver"
icon = "otprelay-receiver.png"
desktop = "otprelay-receiver.desktop"
python = "3.12"

[tool.appimage.hooks]
# PySide6 bundles Jinja templates named *.py, which are not valid Python and
# break the byte-compile step, plus development tools no running app needs.
pre_package = "packaging/trim-appdir.sh"

[tool.setuptools]
packages = ["otprelay_receiver"]
