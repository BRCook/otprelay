[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otprelay-receiver"
version = "0.1.0"
description = "Desktop receiver for otprelay: copies one-time codes from your phones to the clipboard"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.5",
    "PySide6-Addons>=6.5",
    "PyNaCl>=1.5",
    "qrcode>=7.4",
]

[project.gui-scripts]
otprelay-receiver = "otprelay_receiver.app:main"

[tool.setuptools]
packages = ["otprelay_receiver"]
