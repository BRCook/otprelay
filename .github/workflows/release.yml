# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds every artefact a release carries: the desktop receiver as an AppImage,
# the phone app as an APK, and the relay as Debian and Alpine packages. Pushing
# a tag like v0.2.0 also attaches them to the matching GitHub release.
name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Deliberately an older runner: an AppImage links against the glibc it was
    # built with, so building on the newest Ubuntu would refuse to start on
    # anything older.
    runs-on: ubuntu-22.04
    env:
      GPG_KEY_BASE64: ${{ secrets.APPIMAGE_GPG_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the AppImage builder
        run: python -m pip install --upgrade pip "appimage==4.0.1"

      # The AppImage takes its version from the installed package, so the tag
      # has to reach pyproject.toml before the build runs.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: receiver
        run: |
          python - "${GITHUB_REF_NAME#v}" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("pyproject.toml")
          text, count = re.subn(
              r'(?m)^version = ".*"$', f'version = "{sys.argv[1]}"', path.read_text(), count=1)
          if count != 1:
              raise SystemExit("no version line in pyproject.toml")
          path.write_text(text)
          PY
          grep -m1 '^version' pyproject.toml

      - name: Build the AppImage
        working-directory: receiver
        env:
          # CI runners have no FUSE, so appimagetool unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python -m appimage.ctl build

      # The builder leaves the AppDir, appimagetool and runtime in build/, so
      # the AppImage can be packaged once more with a signature embedded.
      # AppImageUpdate remembers the key from the first install and refuses
      # later updates signed with a different one.
      - name: Sign the AppImage
        if: env.GPG_KEY_BASE64 != ''
        working-directory: receiver
        env:
          GPG_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          export GNUPGHOME=$(mktemp -d)
          printf '%s' "$GPG_KEY_BASE64" | base64 -d | gpg --batch --import
          key=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          # gpg needs the passphrase without a prompt: hand it over via the agent.
          echo "allow-loopback-pinentry" > "$GNUPGHOME/gpg-agent.conf"
          echo "pinentry-mode loopback" > "$GNUPGHOME/gpg.conf"
          echo "$GPG_PASSPHRASE" > "$GNUPGHOME/pass"
          update=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["tool"]["appimage"]["update_info"])')
          out=$(ls dist/*.AppImage)
          rm -f "$out" "$out.zsync"
          chmod +x build/appimagetool-x86_64.AppImage
          build/appimagetool-x86_64.AppImage \
            --runtime-file build/runtime-x86_64 \
            --mksquashfs-opt -no-xattrs --mksquashfs-opt -no-duplicates \
            --mksquashfs-opt -processors --mksquashfs-opt 1 \
            --sign --sign-key "$key" \
            --sign-args "--batch --pinentry-mode loopback --passphrase-file $GNUPGHOME/pass" \
            -u "$update" build/AppDir "$out"
          rm -rf "$GNUPGHOME"
          ls -l dist/

      - name: Check that it starts
        working-directory: receiver
        run: |
          chmod +x dist/*.AppImage
          # No display on a runner, so this only proves the bundle is intact
          # and Python starts; the tray itself cannot be tested here.
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --help || true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: otprelay-receiver-appimage
          path: |
            receiver/dist/*.AppImage
            receiver/dist/*.zsync
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            receiver/dist/*.AppImage
            receiver/dist/*.zsync
          generate_release_notes: true

  android:
    runs-on: ubuntu-latest
    # The secrets context cannot be used in an `if`, so they are lifted into
    # the environment here and the steps test those instead.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Signing needs the key, which lives in repository secrets. Without them
      # the APK still builds, just unsigned: useful for checking a pull request,
      # but not installable.
      - name: Restore the signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p "$HOME/.keys"
          chmod 700 "$HOME/.keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.keys/otprelay-release.jks"
          {
            echo "storeFile=$HOME/.keys/otprelay-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$HOME/.keys/otprelay-signing.properties"
          chmod 600 "$HOME/.keys/otprelay-release.jks" "$HOME/.keys/otprelay-signing.properties"

      - name: Work out the version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) name="${GITHUB_REF_NAME#v}" ;;
            *)            name="0.0.0-dev-${GITHUB_SHA:0:7}" ;;
          esac
          # versionCode must be an ever-increasing integer, so pack the three
          # parts of the version into one: 1.2.3 becomes 10203.
          major=$(echo "$name" | cut -d. -f1)
          minor=$(echo "$name" | cut -d. -f2)
          patch=$(echo "$name" | cut -d. -f3 | sed 's/[^0-9].*//')
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          [ "$code" -gt 0 ] || code=1
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Run the tests
        working-directory: android
        run: ./gradlew --no-daemon test

      # Gradle always writes app-release.apk, so the built file is copied out
      # under the name the release should carry.
      - name: Build the APK
        id: apk
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ steps.version.outputs.code }}"
          built=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$built" ] || { echo "no APK was produced" >&2; exit 1; }
          mkdir -p dist
          cp "$built" "dist/otprelay-android-${{ steps.version.outputs.name }}.apk"
          echo "path=android/dist/otprelay-android-${{ steps.version.outputs.name }}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: otprelay-android
          path: android/dist/*.apk
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Work out the version
        id: version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF_NAME#v}" ;;
            *)            version="0.0.0" ;;
          esac
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build the Debian package
        run: server/packaging/build-deb.sh "${{ steps.version.outputs.value }}" dist

      # abuild only exists on Alpine, so that half builds in a container. It
      # refuses to run as root, hence the unprivileged user.
      - name: Build the Alpine package
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            set -eu
            apk add --no-cache alpine-sdk python3 py3-aiohttp >/dev/null
            adduser -D builder
            addgroup builder abuild
            chown -R builder /src
            # abuild signs the package, then verifies it while indexing, so the
            # key it just made has to be trusted here or indexing fails.
            su builder -c "abuild-keygen -a -n"
            cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
            su builder -c "server/packaging/build-apk.sh ${{ steps.version.outputs.value }} dist"
          '

      - name: Check the packages
        run: |
          ls -lh dist/
          dpkg-deb -I dist/*.deb
          dpkg-deb -c dist/*.deb

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: otprelay-server-debian
          path: dist/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: otprelay-server-alpine
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.deb
            dist/*.apk
          generate_release_notes: true