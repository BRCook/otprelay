# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds the desktop receiver as an AppImage. Pushing a tag like v0.2.0 also
# attaches it to the matching GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # Deliberately an older runner: an AppImage links against the glibc it was
    # built with, so building on the newest Ubuntu would refuse to start on
    # anything older.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the AppImage builder
        run: python -m pip install --upgrade pip appimage

      - name: Build the AppImage
        working-directory: receiver
        env:
          # CI runners have no FUSE, so appimagetool unpacks itself instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: python -m appimage.ctl build

      - name: Check that it starts
        working-directory: receiver
        run: |
          chmod +x dist/*.AppImage
          # No display on a runner, so this only proves the bundle is intact
          # and Python starts; the tray itself cannot be tested here.
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/*.AppImage --help || true

      - uses: actions/upload-artifact@v6
        with:
          name: otprelay-receiver-appimage
          path: receiver/dist/*.AppImage
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: receiver/dist/*.AppImage
          generate_release_notes: true

  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Signing needs the key, which lives in repository secrets. Without them
      # the APK still builds, just unsigned: useful for checking a pull request,
      # but not installable.
      - name: Restore the signing key
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.keys"
          chmod 700 "$HOME/.keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$HOME/.keys/otprelay-release.jks"
          {
            echo "storeFile=$HOME/.keys/otprelay-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$HOME/.keys/otprelay-signing.properties"
          chmod 600 "$HOME/.keys/otprelay-release.jks" "$HOME/.keys/otprelay-signing.properties"

      - name: Run the tests
        working-directory: android
        run: ./gradlew --no-daemon test

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Name it after the tag
        id: apk
        working-directory: android
        run: |
          built=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          [ -n "$built" ] || { echo "no APK was produced" >&2; exit 1; }
          version="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version="dev-${GITHUB_SHA:0:7}" ;; esac
          mkdir -p dist
          cp "$built" "dist/otprelay-${version}.apk"
          echo "path=android/dist/otprelay-${version}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v6
        with:
          name: otprelay-apk
          path: android/dist/*.apk
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
